# ============================================================================
# DSH Desktop configuration / DSH Desktop 配置文件
# ----------------------------------------------------------------------------
# Everything here is also editable from the settings menu (the gear button
# in the title bar), which writes this same file without losing these comments.
# 这里的每一项都可以在标题栏右上角的齿轮「设置」里改，保存时不会丢掉下面的注释。
# ============================================================================

# Start the bundled dsh web server / 是否启动内置的 dsh web 服务:
#   1 = start it (default) / 启动内置服务（默认）
#   0 = client only: nothing is started, the window just opens url= below
#       仅作为客户端：不启动任何服务，只打开下面的 url=
server=1

# Server address used when server=0 / 仅客户端模式要填的地址：
#   url=http://10.0.0.123:3080/        another machine
#   url=http://127.0.0.1:3080/?token=  first time, when dsh web printed one
# 拿到 cookie 之后只填纯地址即可；首次访问（或换端口/换机器）时带上 ?token=...。
url=http://127.0.0.1:3080/

# Listen address and port. 0 = let the OS pick a free port on every launch.
# 监听地址与端口；port=0（默认）表示每次自动挑一个空闲端口。
host=127.0.0.1
port=0

# Agent workspace / 智能体的工作区根目录（相对路径相对于本程序所在目录）
workspace=workspace

# Portable data home (DSH_HOME): settings, credentials, sessions, plugins.
# 便携数据目录（DSH_HOME）：配置、密钥、会话、插件都在这里，删掉等于彻底重置。
data=data

# WebView2 browser data (cookies, login state) / 浏览器数据（cookie、登录态）
profile=profile

# Bundled runtime folders, relative to this program's folder.
# 自带运行时目录，相对于本程序所在目录。
runtime=runtime
app=app

# Extra arguments for the dsh web command. Normally empty.
# 追加给 dsh web 的参数，通常留空。
args=

# Address bar: 0 = content-only window (default), 1 = show back/reload/zoom
# 是否显示地址栏：0 = 纯内容窗口（默认），1 = 显示后退/刷新/缩放
toolbar=0

# Initial zoom / 初始缩放比例
zoom=1.0

# Icon style / 图标样式: default | auto | light | dark
icon=default


# WebView2 version to download when the machine has none, or when this
# folder has no webview2\ yet. The installed runtime is always preferred.
# 本机没有 WebView2 且目录里也没有时，下载这个固定版本；有系统运行时就优先用系统。
webview2version=157.0.4341.46

# Close button: 0 = stop the server and quit (default), 1 = minimize to tray.
# 关闭按钮：0 = 停止服务并退出（默认），1 = 最小化到托盘继续运行。
closetotray=0

# Send anonymous usage telemetry to DeepSeek: 0 = off (default) / 1 = on
# 是否上报匿名使用统计：0 = 关闭（默认）/ 1 = 开启
telemetry=0

# Seconds to wait for the server before reporting a startup failure.
# 启动等待秒数，超时则报错并给出日志。
startupseconds=120
